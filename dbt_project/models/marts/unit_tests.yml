unit_tests:
  - name: completed_orders_sum_to_expected_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, valid_from: '2026-04-30T12:25:30+00:00'}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}

  - name: non_completed_orders_are_excluded
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 999.0, status: pending, order_date: '2026-08-01'}
          - {order_id: 3, customer_id: C0001, amount_usd: 999.0, status: cancelled, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, valid_from: '2026-04-30T12:25:30+00:00'}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 1, daily_revenue: 100.0}

  # Strong challenge (Phase 2): a customer dimension with more than one
  # "active" row for the same customer_id must not fan out the join and
  # inflate revenue. This fails against the original (undeduplicated)
  # active_customers CTE and passes after ranking/deduplicating by
  # customer_id in fct_daily_revenue.sql.
  - name: duplicate_active_customer_rows_do_not_inflate_revenue
    model: fct_daily_revenue
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: C0001, amount_usd: 100.0, status: completed, order_date: '2026-08-01'}
          - {order_id: 2, customer_id: C0001, amount_usd: 70.0, status: completed, order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: C0001, is_active: true, valid_from: '2026-01-01T00:00:00+00:00'}
          - {customer_id: C0001, is_active: true, valid_from: '2026-04-30T12:25:30+00:00'}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}
